# Host Nginx site for Quant Lab. TLS lines are added by certbot (deploy/enable-domain.sh).
# app.icash.uz belongs to another project and is deliberately not listed.
limit_req_zone $binary_remote_addr zone=quantlab_login:10m rate=5r/m;

# The bare domain deliberately serves nothing. Without this block the host's default site, which
# belongs to another project, would answer for it. `location` rather than a server-level return
# lets certbot's challenge through.
server {
    listen 80;
    listen [::]:80;
    server_name icash.uz;
    location / { return 444; }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.icash.uz;
    client_max_body_size 1m;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /api/q/auth/login {
        limit_req zone=quantlab_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.icash.uz;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    location = /auth/login {
        limit_req zone=quantlab_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
