<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/ican-business-design-system-64d11fa8-448a-41b1-9653-97041b289bb2/colors_and_type.css">
<script src="_ds/ican-business-design-system-64d11fa8-448a-41b1-9653-97041b289bb2/_ds_bundle.js"></script>
<script src="ql.js"></script>
</helmet>
<div onMouseEnter="{{ enter }}" onMouseLeave="{{ leave }}" style="position:relative;height:100%;box-sizing:border-box;background:#151C2C;border:1px solid #263244;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0;font-family:var(--font-ui);color:#F1F5F9">
  <div style="display:flex;align-items:center;gap:6px;min-width:0">
    <span style="font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#94A3B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.label }}</span>
    <sc-if value="{{ hasTip }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="QL.Icon" icon="info" size="13" color="#64748B" hint-size="13px,13px"></x-import></sc-if>
  </div>
  <div style="font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:{{ valColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.value }}</div>
  <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}"><div style="font-size:12px;line-height:16px;color:{{ subColor }};font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.sub }}</div></sc-if>
  <sc-if value="{{ hasSpark }}" hint-placeholder-val="{{ false }}"><div style="margin-top:auto;padding-top:2px"><x-import component-from-global-scope="QL.Spark" values="{{ m.spark }}" color="{{ m.sparkColor }}" height="26" hint-size="100%,26px"></x-import></div></sc-if>
  <sc-if value="{{ showTip }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:10px;right:10px;top:calc(100% + 6px);z-index:40;background:#1B2435;border:1px solid #334155;border-radius:8px;padding:10px 12px;font-size:12px;line-height:17px;font-weight:500;color:#CBD5E1;box-shadow:0 10px 28px rgba(0,0,0,.5)">{{ m.tip }}</div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:130},&quot;m&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,value:string,sub?:string,color?:string,subColor?:string,tip?:string,spark?:number[],sparkColor?:string}&quot;}}">
class Component extends DCLogic {
  state = { hover: false };
  renderVals() {
    const m = this.props.m || {};
    return {
      m, valColor: m.color || '#F1F5F9', subColor: m.subColor || '#94A3B8',
      hasSub: !!m.sub, hasTip: !!m.tip, hasSpark: !!(m.spark && m.spark.length > 1),
      showTip: this.state.hover && !!m.tip,
      enter: () => this.setState({ hover: true }), leave: () => this.setState({ hover: false })
    };
  }
}
</script>
</body>
</html>
