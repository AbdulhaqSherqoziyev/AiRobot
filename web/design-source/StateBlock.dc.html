<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/ican-business-design-system-64d11fa8-448a-41b1-9653-97041b289bb2/colors_and_type.css">
<script src="_ds/ican-business-design-system-64d11fa8-448a-41b1-9653-97041b289bb2/_ds_bundle.js"></script>
<script src="ql.js"></script>
</helmet>
<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;flex-direction:column;gap:14px;font-family:var(--font-ui)">
    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:#94A3B8">
      <x-import component-from-global-scope="QL.LiveDot" color="#3B82F6" hint-size="8px,8px"></x-import>
      <span>Ma'lumotlar yuklanmoqda…</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px">
      <sc-for list="{{ skel }}" as="k" hint-placeholder-count="4">
        <div style="background:#151C2C;border:1px solid #263244;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px">
          <x-import component-from-global-scope="QL.Skel" h="10" w="40%" hint-size="40%,10px"></x-import>
          <x-import component-from-global-scope="QL.Skel" h="22" w="70%" hint-size="70%,22px"></x-import>
          <x-import component-from-global-scope="QL.Skel" h="10" w="55%" hint-size="55%,10px"></x-import>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:14px">
      <div style="flex:2 1 520px;min-width:0;background:#151C2C;border:1px solid #263244;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
        <x-import component-from-global-scope="QL.Skel" h="12" w="30%" hint-size="30%,12px"></x-import>
        <x-import component-from-global-scope="QL.Skel" h="260" r="8" hint-size="100%,260px"></x-import>
      </div>
      <div style="flex:1 1 300px;min-width:0;background:#151C2C;border:1px solid #263244;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px">
        <x-import component-from-global-scope="QL.Skel" h="12" w="45%" hint-size="45%,12px"></x-import>
        <sc-for list="{{ rows }}" as="k" hint-placeholder-count="6">
          <x-import component-from-global-scope="QL.Skel" h="30" r="6" hint-size="100%,30px"></x-import>
        </sc-for>
      </div>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isBox }}" hint-placeholder-val="{{ false }}">
  <div style="background:#151C2C;border:1px solid #263244;border-radius:12px;padding:48px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;font-family:var(--font-ui)">
    <div style="width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:{{ iconBg }};color:{{ iconColor }}">
      <x-import component-from-global-scope="QL.Icon" icon="{{ icon }}" size="22" hint-size="22px,22px"></x-import>
    </div>
    <div style="font-family:var(--font-display);font-size:16px;font-weight:600;color:#F1F5F9">{{ title }}</div>
    <div style="max-width:440px;font-size:13px;line-height:20px;color:#94A3B8;text-wrap:pretty">{{ text }}</div>
    <sc-if value="{{ hasAction }}" hint-placeholder-val="{{ true }}">
      <button onClick="{{ onAction }}" style="margin-top:6px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid #3B82F6;background:#3B82F6;color:#fff;font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer" style-hover="background:#2563EB;border-color:#2563EB">{{ actionLabel }}</button>
    </sc-if>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:360},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;],&quot;default&quot;:&quot;empty&quot;,&quot;tsType&quot;:&quot;'loading'|'empty'|'error'&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actionLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || 'empty', err = k === 'error';
    return {
      isLoading: k === 'loading', isBox: k !== 'loading', skel: [1, 2, 3, 4], rows: [1, 2, 3, 4, 5, 6],
      icon: this.props.icon || (err ? 'triangle-alert' : 'inbox'),
      iconColor: err ? '#EA3943' : '#60A5FA', iconBg: err ? 'rgba(234,57,67,.12)' : 'rgba(59,130,246,.12)',
      title: this.props.title || (err ? "Ma'lumotlarni yuklab bo'lmadi" : "Hozircha ma'lumot yo'q"),
      text: this.props.text || (err ? "Server javob bermadi (HTTP 503). Ulanishni tekshirib, qayta urinib ko'ring." : ''),
      hasAction: !!this.props.actionLabel, actionLabel: this.props.actionLabel,
      onAction: () => this.props.onAction && this.props.onAction()
    };
  }
}
</script>
</body>
</html>
